[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemmajev"
version = "0.1.0"
description = "Jev-style game decisions with Gemma and Tunix"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-tunix==0.1.7",
    "jax==0.8.1",
    "flax==0.12.0",
    "orbax-checkpoint==0.12.0",
    "qwix==0.1.6",
    "transformers==4.57.6",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.8.1"]
dev = ["ruff==0.16.8", "build==1.6.1"]
analysis = ["matplotlib==3.11.2"]
demo = ["playwright==1.58.0", "pillow>=11,<13"]
games = ["vizdoom==1.3.0"]

[tool.setuptools]
packages = ["gemmajev"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["gemmajev/**/*.py", "scripts/**/*.py", "tests/**/*.py", "examples/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
